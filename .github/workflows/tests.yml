name: Synthetic native-vault tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 046094df28b712f62a5e3c728a9e59da05dcbf1e
          path: hermes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build isolated native test environment through PM
        shell: bash
        working-directory: hermes
        run: python -m pm.build_env --source . --out "$GITHUB_WORKSPACE/test-env" --group dev --group test
      - name: Install bot SDKs and browser-test dependency in the isolated environment only
        shell: bash
        run: uv pip install --python "$GITHUB_WORKSPACE/test-env/Scripts/python.exe" aiohttp python-telegram-bot discord.py playwright
      - name: Provision Chrome for disposable captured-browser tests
        shell: bash
        run: '"$GITHUB_WORKSPACE/test-env/Scripts/python.exe" -m playwright install chrome'
      - name: Test synthetic HTTP and native encrypted vault
        shell: bash
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/secure-entry-test-home
          TMPDIR: ${{ runner.temp }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/hermes;$GITHUB_WORKSPACE/plugin"
          "$GITHUB_WORKSPACE/test-env/Scripts/python.exe" -m unittest discover -s tests -v
          "$GITHUB_WORKSPACE/test-env/Scripts/python.exe" -c "from hermes_cli.plugins_cmd import cmd_plugin_doctor; cmd_plugin_doctor('.', ci=True)"
          "$GITHUB_WORKSPACE/test-env/Scripts/python.exe" -c "from hermes_cli.plugins_cmd_catalog import cmd_validate; cmd_validate('.', as_json=True, install_deps=False)"
